name: Zip ile güncelle

# Trlive-Web (Yönetim / Ajans paneli) için. Kullanım: panel zip'ini GitHub sitesinden "Add file > Upload files" ile
# deponun ANA DİZİNİNE yükleyin. Bu iş akışı zip'i açar, projeyi içindekiyle eşitler, zip'i siler ve paneli yayınlar.
# Not: .github klasörü zip'ten güncellenmez (GitHub kuralı); "deploy.yml" dosyasını bir kez elle eklemelisiniz.
on:
  push:
    branches: [main]
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: zip-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Zip'i aç ve projeyi eşitle
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(ls ./*.zip 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$ZIP" ]; then echo "Ana dizinde zip yok."; echo "NOZIP=1" >> "$GITHUB_ENV"; exit 0; fi
          echo "Zip: $ZIP"
          T="$(mktemp -d)"
          unzip -q "$ZIP" -d "$T"
          if [ ! -f "$T/package.json" ]; then
            D="$(find "$T" -mindepth 1 -maxdepth 1 -type d | head -1)"
            if [ -n "$D" ] && [ -f "$D/package.json" ]; then T="$D"; fi
          fi
          grep -q '"tr-live-web"' "$T/package.json" 2>/dev/null || { echo "HATA: zip panel projesi değil (package.json yok ya da farklı)."; exit 1; }
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rm -rf "$T/.github"
          cp -a "$T/." .
          rm -f ./*.zip

      - name: Değişiklikleri kaydet
        if: env.NOZIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Değişiklik yok."; echo "NOCHANGE=1" >> "$GITHUB_ENV"; exit 0; fi
          git commit -q -m "Panel zip ile güncellendi"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 3)); git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort || true; echo "::error::Birleştirilemedi"; exit 1; }
          done
          echo "::error::Gönderilemedi"; exit 1

      - name: Paneli yayınla
        if: env.NOZIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run deploy.yml --ref main || echo "Yayın otomatik başlatılamadı; Actions → 'Paneli yayınla' → Run workflow ile başlatın."
